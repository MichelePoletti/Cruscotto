<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Cruscotto assistenti digitali</title>
<style>
  :root{ color-scheme: light dark; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f9f9f7;color:#0b0b0b}
  @media (prefers-color-scheme: dark){ body{background:#0d0d0d;color:#fff} }
  #lock{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;
        background:#0f1419;padding:20px}
  #lock .box{background:#1a212b;border:1px solid #2c3744;border-radius:16px;
             padding:32px 34px;max-width:360px;width:100%;text-align:center}
  #lock .em{font-size:34px;line-height:1}
  #lock h1{color:#fff;font-size:18px;font-weight:640;margin:14px 0 6px}
  #lock p{color:#8a98a8;font-size:13px;margin:0 0 20px;line-height:1.5}
  #lock input{width:100%;padding:11px 13px;border-radius:9px;border:1px solid #2c3744;
              background:#0f1419;color:#fff;font-size:15px;outline:none}
  #lock input:focus{border-color:#3987e5}
  #lock button{width:100%;margin-top:10px;padding:11px;border:0;border-radius:9px;
               background:#3987e5;color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  #lock button:hover{background:#2a78d6}
  #lock button:disabled{opacity:.6;cursor:default}
  #err{color:#ff6b6b;font-size:12.5px;margin-top:12px;min-height:16px}
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <div class="em">&#128274;</div>
    <h1>Cruscotto assistenti digitali</h1>
    <p>Inserisci la password per vedere i dati.</p>
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus>
    <button id="go">Entra</button>
    <div id="err"></div>
  </div>
</div>

const _CHIAVE = 'cruscotto-pw';   // dove ricordo la password per questa sessione

function b64d(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }

// Decifra e mostra. Se la password e' sbagliata, lancia un errore.
async function svela(pw){
  const km  = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:b64d(_SALT), iterations:_ITER, hash:'SHA-256' },
    km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  const pt   = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64d(_IV) }, key, b64d(_CT));
  const html = new TextDecoder().decode(pt);

  // Password giusta: me la ricordo, cosi' passando all'altra pagina del cruscotto
  // non la si deve ridigitare. Resta solo in questa scheda: chiusa la scheda, sparisce.
  try { sessionStorage.setItem(_CHIAVE, pw); } catch (e) {}

  document.open(); document.write(html); document.close();
}

async function apri(){
  const pw  = document.getElementById('pw').value;
  const err = document.getElementById('err');
  const bt  = document.getElementById('go');
  if (!pw) { err.textContent = 'Scrivi la password.'; return; }

  bt.disabled = true; bt.textContent = 'Apro…'; err.textContent = '';
  try {
    await svela(pw);
  } catch (e) {
    bt.disabled = false; bt.textContent = 'Entra';
    err.textContent = 'Password sbagliata.';
    document.getElementById('pw').select();
  }
}

document.getElementById('go').addEventListener('click', apri);
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') apri(); });

// Arrivo dall'altra pagina del cruscotto? Allora la password la so gia': entro da solo.
(async function(){
  let pw = null;
  try { pw = sessionStorage.getItem(_CHIAVE); } catch (e) {}
  if (!pw) return;
  try { await svela(pw); }
  catch (e) { try { sessionStorage.removeItem(_CHIAVE); } catch (e2) {} }  // password vecchia: chiedila
})();
</script>
